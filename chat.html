<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrelace - Conversas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://unpkg.com/@phosphor-icons/web"></script><style>
:root{--primary:#354de3;--text:#172744;--muted:#7b8ba7;--border:#dce4f0;--bg:#f6f8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Montserrat,Arial,sans-serif}.top{height:66px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;gap:18px}.logo{font-weight:800;font-size:20px}.logo i{color:var(--primary);font-size:25px;vertical-align:middle;margin-right:8px}.back{margin-left:auto;text-decoration:none;color:var(--primary);font-weight:700}.layout{width:min(1100px,calc(100% - 32px));height:calc(100vh - 106px);min-height:500px;margin:20px auto;background:white;border:1px solid var(--border);border-radius:15px;display:grid;grid-template-columns:310px 1fr;overflow:hidden}.sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}.sidehead{padding:22px;border-bottom:1px solid var(--border)}h1{font-size:21px;margin:0 0 14px}.search{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:9px;font:inherit}.list{overflow:auto}.person{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid #eff2f7;cursor:pointer}.person.active,.person:hover{background:#f4f6ff}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e8edff;color:var(--primary);font-weight:800;flex:none}.person strong{display:block;font-size:13px}.person small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.chat{display:flex;flex-direction:column;min-width:0}.chathead{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}.chathead strong{display:block}.chathead small{display:block;color:var(--muted);margin-top:4px}.messages{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:13px;background:#fbfcff}.bubble{max-width:min(72%,520px);padding:12px 14px;border-radius:13px;line-height:1.5;background:#eef2f9;align-self:flex-start;color:#354762;overflow-wrap:anywhere}.bubble.mine{background:var(--primary);color:white;align-self:flex-end}.time{display:block;font-size:10px;opacity:.7;text-align:right;margin-top:5px}.composer{display:flex;gap:10px;padding:15px 18px;border-top:1px solid var(--border)}.composer input{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;padding:13px;font:inherit}.send{border:0;border-radius:10px;background:var(--primary);color:#fff;padding:0 18px;font-weight:700;cursor:pointer}.empty{margin:auto;text-align:center;color:var(--muted);padding:25px}.empty i{font-size:42px;color:#a8b5ce}.empty h2{font-size:18px;color:var(--text);margin:12px 0 7px}.empty p{font-size:12px;line-height:1.6;max-width:330px;margin:0 auto}.empty-list{margin:auto;text-align:center;color:var(--muted);padding:24px}.empty-list i{font-size:34px}.mobile-back{display:none}.privacy{font-size:10px;color:var(--muted);text-align:center;padding:8px;border-top:1px solid var(--border)}@media(max-width:680px){.layout{grid-template-columns:1fr;height:calc(100vh - 95px);margin:12px auto}.sidebar{display:none}.sidebar.show{display:flex}.chat.hide{display:none}.mobile-back{display:inline-block;border:0;background:none;color:var(--primary);font-size:20px;margin-right:5px}.top{padding:0 14px}}
</style></head><body><header class="top"><div class="logo"><i class="ph-fill ph-circles-three-plus"></i>Entrelace</div><a class="back" href="app.html">← Voltar à comunidade</a></header><main class="layout"><aside class="sidebar" id="sidebar"><div class="sidehead"><h1>Conversas</h1><input id="search" class="search" placeholder="Buscar conversa..."></div><div class="list" id="list"></div></aside><section class="chat" id="chat"><div class="empty"><i class="ph ph-chats"></i><h2>Suas conversas</h2><p>Entre no mural da comunidade e toque em “Conversar” em uma publicação para iniciar uma conversa privada.</p></div></section></main><script>
const $=id=>document.getElementById(id);let chats={},active='';try{chats=JSON.parse(localStorage.getItem('entrelaceChats')||'{}')}catch(e){chats={}}active=localStorage.getItem('entrelaceActiveContact')||'';
function save(){localStorage.setItem('entrelaceChats',JSON.stringify(chats));localStorage.setItem('entrelaceActiveContact',active)}
function renderList(){const list=$('list');list.innerHTML='';const names=Object.keys(chats);if(!names.length){list.innerHTML='<div class="empty-list"><i class="ph ph-chat-circle"></i><p>Nenhuma conversa ainda.</p></div>';return}names.forEach(name=>{const el=document.createElement('div');el.className='person'+(name===active?' active':'');const av=document.createElement('div');av.className='avatar';av.textContent=name.charAt(0).toUpperCase();const info=document.createElement('div');const strong=document.createElement('strong');strong.textContent=name;const small=document.createElement('small');small.textContent=chats[name].at(-1)?.text||'Conversa iniciada';info.append(strong,small);el.append(av,info);el.onclick=()=>openChat(name);list.append(el)})}
function openChat(name){active=name;save();renderList();const chat=$('chat');chat.innerHTML='';const head=document.createElement('div');head.className='chathead';const back=document.createElement('button');back.className='mobile-back';back.textContent='←';back.onclick=()=>{$('sidebar').classList.add('show');chat.classList.add('hide')};const av=document.createElement('div');av.className='avatar';av.textContent=name.charAt(0).toUpperCase();const title=document.createElement('div');const strong=document.createElement('strong');strong.textContent=name;const small=document.createElement('small');small.textContent='Conversa privada • telefone protegido';title.append(strong,small);head.append(back,av,title);const msgs=document.createElement('div');msgs.className='messages';(chats[name]||[]).forEach(m=>{const b=document.createElement('div');b.className='bubble'+(m.from==='me'?' mine':'');b.textContent=m.text;const t=document.createElement('span');t.className='time';t.textContent=m.time||'';b.append(t);msgs.append(b)});if(!(chats[name]||[]).length){const e=document.createElement('div');e.className='empty';e.textContent='Conversa iniciada. Envie a primeira mensagem.';msgs.append(e)}const privacy=document.createElement('div');privacy.className='privacy';privacy.textContent='Suas mensagens ficam salvas somente neste navegador neste protótipo.';const form=document.createElement('form');form.className='composer';const input=document.createElement('input');input.placeholder='Digite sua mensagem...';input.maxLength=1000;input.required;const send=document.createElement('button');send.className='send';send.textContent='Enviar';form.append(input,send);form.onsubmit=e=>{e.preventDefault();const value=input.value.trim();if(!value)return;(chats[active]=chats[active]||[]).push({from:'me',text:value,time:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});save();openChat(active)};chat.append(head,msgs,privacy,form);msgs.scrollTop=msgs.scrollHeight;$('sidebar').classList.remove('show');chat.classList.remove('hide')}
$('search').oninput=()=>{const q=$('search').value.toLowerCase();document.querySelectorAll('.person').forEach(p=>p.style.display=p.textContent.toLowerCase().includes(q)?'flex':'none')};renderList();if(active&&chats[active])openChat(active);
</script></body></html>
