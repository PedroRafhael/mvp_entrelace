<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrelace - Entrar</title>
    <link rel="stylesheet" href="stylelogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo-container">
                <div class="logo-icon"><i class="ph-fill ph-circles-three-plus"></i></div>
                <span class="logo-text">Entrelace</span>
            </div>
            <span class="badge-wireframe">Wireframe MVP</span>
        </div>
    </nav>

    <!-- Conteúdo Principal - Layout em duas colunas -->
    <main class="login-split-container">
        
        <!-- Coluna Esquerda: Espaço vazio conforme protótipo -->
        <section class="login-left">
            <!-- Espaço reservado -->
        </section>

        <!-- Coluna Direita: Formulário de Login -->
        <section class="login-right">
            <div class="login-form-wrapper">
                <h1 class="login-title">Bem-vindo!</h1>
                
                <form class="login-form" action="#" method="POST">
                    
                    <div class="form-group">
                        <label for="email">Endereço de e-mail:</label>
                        <input type="email" id="email" placeholder="Adicione seu e-mail" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" placeholder="Adicione sua senha" required>
                    </div>
                    
                    <div class="form-options">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="remember">
                            <span class="checkmark"></span>
                            Lembrar de mim
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-primary btn-block">
                        entrar <i class="ph ph-arrow-right"></i>
                    </button>
                    
                </form>

                <div class="social-login-section">
                    <p>Continuar com:</p>
                    <div class="social-buttons">
                        <button type="button" class="btn-social">Google</button>
                        <button type="button" class="btn-social">Facebook</button>
                        <button type="button" class="btn-social">Icloud</button>
                    </div>
                </div>
            </div>
        </section>
        
    </main>

    <footer class="site-footer">
        <p>Entrelace - Protótipo Acadêmico de Front-End (Sem Back-end)</p>
    </footer>
</body>
</html>
